spring.application.name=sb-ecomm

#enabling the h2 db
#spring.h2.console.enabled=true
#connect to h2 db
# spring.datasource.url=jdbc:h2:mem:test

# mysql database
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce
spring.datasource.username=springstudent
spring.datasource.password=${DB_PASS_KEY}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# to see the sql queries run by jpa
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# jpa by default drop the previous table and create new ones every time.
# since we are using in mem db every time the schema will be created again.
# spring.jpa.hibernate.ddl-auto=update

# images
project.image=images/

spring.app.jwtSecret=${JWT_SECRET_KEY}
spring.app.jwtExpirationMs=300000000
spring.ecom.app.jwtCookieName=springBootEcom

logging.level.org.springframework=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.ecommerce.project=DEBUG
frontend.url=http://localhost:5173
image.base.url=http://localhost:8080/images

# STRIPE KEY
stripe.secret.key=${STRIPE_SECRET_KEY}